services:
  vector-db:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  chatbot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=vector-db
      - QDRANT_PORT=6333
    depends_on:
      - vector-db

